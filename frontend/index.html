<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>ZKBZ 标准PDF下载</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=4.10.0" />
</head>
<body>
  <div class="app-shell" id="appLayout">
    <div class="app-body">
      <header class="app-header">
        <div class="header-brand">
          <span class="header-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 3.5h7.2L19 8.3V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5H7z"/>
              <path d="M14 3.5V8h5"/>
              <path d="M9 12h6M9 15.5h6"/>
            </svg>
          </span>
          <span class="header-badge">ZKBZ 标准PDF下载</span>
        </div>
        <div class="header-meta">
          <span class="header-db" id="headerDbStatus">加载中…</span>
        </div>
      </header>

      <main class="main-area mode-search" id="mainArea">
        <div class="page-head" id="pageHead">
          <h2 class="page-title" id="pageTitle">标准检索</h2>
          <p class="page-subtitle" id="pageSubtitle">支持标准编号、名称检索与多维度高级筛选，一键下载 PDF。</p>
        </div>

        <div class="search-tools" id="searchTools">
          <div class="search-tools-left">
            <button type="button" class="btn-advanced-toggle" id="btnAdvancedToggle">高级选项</button>
          </div>
          <div class="bulk-bar">
            <label class="bulk-select-all"><input type="checkbox" id="chkSelectPage" /> 本页全选</label>
            <button type="button" class="btn-bulk-download" id="btnBulkDownload" disabled>
              多项下载 (<span id="bulkCount">0</span>)
            </button>
          </div>
        </div>

        <section class="ai-search-panel" id="aiSearchPanel">
          <div class="ai-search-head">
            <span class="ai-search-badge">AI</span>
            <span class="ai-search-title">AI检索</span>
          </div>
          <div class="ai-search-row">
            <input
              type="text"
              id="aiPrompt"
              class="ai-search-input"
              placeholder="用自然语言描述需求，例如：近五年现行的饮料相关国家标准，起草单位在山东"
              autocomplete="off"
            />
            <button type="button" class="btn-ai-search" id="btnAiSearch">AI检索</button>
          </div>
          <div class="ai-suggestions" id="aiSuggestions">
            <span class="ai-sug-label">常用示例：</span>
            <button type="button" class="ai-sug" data-prompt="近五年现行的饮料相关国家标准">近五年现行饮料国标</button>
            <button type="button" class="ai-sug" data-prompt="山东地区牙膏相关现行标准">山东牙膏现行标准</button>
            <button type="button" class="ai-sug" data-prompt="废止的煤矿安全行业标准">废止煤矿行标</button>
          </div>
          <p class="ai-search-hint" id="aiSearchHint" hidden></p>
        </section>

        <div class="advanced-panel" id="advancedPanel" hidden>
          <div class="advanced-grid">
            <label class="adv-field">
              <span>状态</span>
              <select id="advExState"></select>
            </label>
            <label class="adv-field">
              <span>标准大类</span>
              <select id="advStdCategory"></select>
            </label>
            <label class="adv-field">
              <span>省</span>
              <select id="advProvince"></select>
            </label>
            <label class="adv-field">
              <span>市</span>
              <select id="advCity"></select>
            </label>
            <label class="adv-field">
              <span>县/区</span>
              <select id="advCounty"></select>
            </label>
            <label class="adv-field adv-field-wide">
              <span>产品/品种</span>
              <div class="adv-combo">
                <input type="text" id="advProduct" placeholder="输入或选择，如：牙膏、铅笔、煤矿" autocomplete="off" spellcheck="false" />
                <div class="adv-combo-panel" id="advProductPanel" hidden role="listbox"></div>
              </div>
            </label>
            <label class="adv-field adv-field-wide">
              <span>公司/起草单位</span>
              <div class="adv-combo">
                <input type="text" id="advCompany" placeholder="输入单位名称关键词" autocomplete="off" spellcheck="false" />
                <div class="adv-combo-panel" id="advCompanyPanel" hidden role="listbox"></div>
              </div>
            </label>
            <label class="adv-field">
              <span>起草顺位</span>
              <select id="advUnitRank">
                <option value="">不限（任一顺位）</option>
                <option value="1">第 1 起草单位</option>
                <option value="2">第 2 起草单位</option>
                <option value="3">第 3 起草单位</option>
                <option value="gt3">大于三（第 4 位及以后）</option>
              </select>
            </label>
            <label class="adv-field">
              <span>年份起</span>
              <select id="advYearFrom"></select>
            </label>
            <label class="adv-field">
              <span>年份止</span>
              <select id="advYearTo"></select>
            </label>
            <div class="adv-field adv-year-presets">
              <span>年份快捷</span>
              <div class="year-preset-btns">
                <button type="button" class="year-preset" data-years="3">近3年</button>
                <button type="button" class="year-preset" data-years="5">近5年</button>
                <button type="button" class="year-preset" data-years="10">近10年</button>
              </div>
            </div>
          </div>
          <div class="advanced-actions">
            <button type="button" class="btn-secondary" id="btnAdvancedReset">重置条件</button>
            <button type="button" class="btn-geo-download" id="btnGeoDownload" disabled title="需先选择省份">地区批量下载</button>
            <button type="button" class="btn-search" id="btnAdvancedApply">应用筛选</button>
          </div>
        </div>

        <div class="search-panel" id="searchPanel">
          <form class="search-box" id="searchForm">
            <span class="search-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input
              type="text"
              id="query"
              name="q"
              placeholder="标准编号或名称关键词，如 GB/T 1002-2024、煤矿"
              autocomplete="off"
            />
            <button type="submit" class="btn-search" id="btnSearch">检索</button>
          </form>
        </div>

        <div id="results"></div>
      </main>
    </div>

    <div class="batch-dock" id="batchDock">
      <button type="button" class="batch-fab" id="btnBatchFab" title="批量下载" aria-expanded="false" aria-controls="batchFloat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="m7 10 5 5 5-5"/>
          <path d="M12 15V3"/>
        </svg>
        <span class="batch-fab-label">批量下载</span>
      </button>
    </div>

    <div class="batch-float" id="batchFloat" hidden>
      <div class="batch-float-backdrop" id="batchFloatBackdrop"></div>
      <div class="batch-float-panel batch-stage" id="batchStage" role="dialog" aria-modal="true" aria-labelledby="batchFloatTitle">
        <div class="batch-panel" id="batchToolbar">
          <header class="batch-float-head">
            <div class="batch-hero-text">
              <p class="batch-eyebrow">批量处理</p>
              <h2 class="batch-title" id="batchFloatTitle">标准 PDF 批量下载</h2>
              <p class="batch-subtitle">Excel 填标准号 → 匹配库内 PDF → 打包 ZIP</p>
            </div>
            <button type="button" class="batch-float-close" id="btnBatchFloatClose" title="关闭" aria-label="关闭批量下载">×</button>
          </header>
          <ol class="batch-steps" id="batchSteps" aria-label="操作步骤">
            <li class="is-active" data-step="1"><span>1</span>下载模板</li>
            <li data-step="2"><span>2</span>上传解析</li>
            <li data-step="3"><span>3</span>预览下载</li>
          </ol>

          <div class="batch-grid batch-grid-2">
            <section class="batch-card batch-card-template">
              <div class="batch-card-head">
                <div class="batch-card-icon batch-icon-template" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
                </div>
                <div>
                  <h3 class="batch-card-title">Excel 输入模板</h3>
                  <p class="batch-card-desc">三列即可，备注列留空由系统自动填写</p>
                </div>
              </div>
              <ul class="batch-card-list">
                <li><strong>标准号</strong> — 必填</li>
                <li><strong>标准名</strong> — 选填</li>
                <li><strong>备注</strong> — 未找到时自动填「否」</li>
              </ul>
              <button type="button" class="btn-template" id="btnBatchTemplate">下载 Excel 模板</button>
            </section>

            <section class="batch-card batch-card-upload">
              <div class="batch-card-head">
                <div class="batch-card-icon batch-icon-upload" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <div>
                  <h3 class="batch-card-title">上传表格</h3>
                  <p class="batch-card-desc">.xlsx / .csv，最多 400 条</p>
                </div>
              </div>
              <label class="batch-dropzone" id="batchDropzone">
                <input type="file" id="batchFile" accept=".xlsx,.xlsm,.csv" hidden />
                <span class="batch-dropzone-text">点击或拖入文件</span>
                <span class="batch-dropzone-name" id="batchFileName">未选择文件</span>
              </label>
              <div class="batch-actions">
                <button type="button" class="btn-batch btn-batch-primary" id="btnBatchParse">解析</button>
                <button type="button" class="btn-batch btn-batch-secondary" id="btnBatchPreview" disabled>预览</button>
                <button type="button" class="btn-batch btn-batch-accent" id="btnBatchDownload" disabled>下载 ZIP</button>
              </div>
              <p class="batch-meta" id="batchMeta">按数据库路径匹配 PDF</p>
            </section>
          </div>

          <div class="batch-table-section" id="batchTableSection" hidden>
            <div class="batch-table-head">
              <h3 class="batch-table-heading">匹配预览</h3>
              <button type="button" class="btn-batch btn-batch-ghost" id="btnBatchBack">← 返回</button>
            </div>
            <div class="batch-table-wrap" id="batchTableWrap"></div>
          </div>
          <div class="batch-feedback" id="batchFeedback" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/workflow.js?v=1.2.0"></script>
  <script src="js/app.js?v=4.8.0"></script>
  <script src="js/advanced.js?v=4.9.1"></script>
  <script src="js/ai-search.js?v=1.0.1"></script>
  <script src="js/batch.js?v=4.3.1"></script>
</body>
</html>
