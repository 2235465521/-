<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系统后台 · ZKBZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=4.7.1" />
  <link rel="stylesheet" href="css/admin.css?v=1.5.1" />
</head>
<body>
  <div class="admin-layout" id="adminLayout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <div class="admin-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3.5h7.2L19 8.3V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5H7z"/>
            <path d="M14 3.5V8h5"/>
            <path d="M9 12h6M9 15.5h6"/>
          </svg>
        </div>
        <div class="brand-text">
          <h3>ZKBZ</h3>
          <div class="brand-sub">系统后台</div>
        </div>
      </div>
      <nav class="admin-side-nav" aria-label="后台菜单">
        <button type="button" class="admin-nav-item" data-panel="profile" id="navProfile">个人中心</button>
        <button type="button" class="admin-nav-item" data-panel="users" id="navUsers" hidden>用户管理</button>
      </nav>
      <div class="sidebar-tools">
        <div class="sidebar-tools-title">工具</div>
        <button type="button" class="sidebar-collapse-btn" id="btnToggleSidebar" title="收起侧边栏" aria-expanded="true">
          <span class="collapse-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
          <span class="collapse-text" id="sidebarCollapseText">收起侧边栏</span>
        </button>
      </div>
      <div class="admin-sidebar-foot">
        <a class="admin-back-front" href="/" id="btnBackFront"><span class="sidebar-label">返回前台主页</span></a>
      </div>
    </aside>

    <div class="admin-workspace">
      <header class="admin-top">
        <div class="admin-top-left">
          <h1 id="pageTitle">个人中心</h1>
        </div>
        <div class="admin-top-right">
          <div class="user-menu" id="adminUserMenu">
            <button type="button" class="user-menu-trigger" id="adminUserTrigger" aria-haspopup="true" aria-expanded="false">
              <span class="header-user-text">
                <span class="header-user-name" id="adminWho">—</span>
                <span class="header-user-role" id="adminRoleLabel">—</span>
              </span>
              <span class="header-avatar" id="adminAvatar">—</span>
            </button>
            <div class="user-menu-panel" id="adminUserPanel" hidden>
              <div class="user-menu-role" id="adminMenuRole">—</div>
              <a class="user-menu-item" href="/">返回前台主页</a>
              <button type="button" class="user-menu-item danger" id="btnLogout">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <main class="admin-main">
        <section class="admin-card" id="panelProfile" hidden>
          <h2 class="admin-section-title">我的账号</h2>
          <dl class="profile-grid" id="profileGrid">
            <div><dt>用户名</dt><dd id="pfUsername">—</dd></div>
            <div><dt>显示名</dt><dd id="pfDisplay">—</dd></div>
            <div><dt>角色</dt><dd id="pfRole">—</dd></div>
            <div><dt>状态</dt><dd id="pfStatus">—</dd></div>
            <div><dt>注册时间</dt><dd id="pfCreated">—</dd></div>
            <div><dt>最近登录</dt><dd id="pfLastLogin">—</dd></div>
          </dl>

          <h2 class="admin-section-title">修改密码</h2>
          <form id="pwdForm" class="pwd-form">
            <label>
              <span>原密码</span>
              <input type="password" id="pwdOld" required minlength="1" autocomplete="current-password" />
            </label>
            <label>
              <span>新密码</span>
              <input type="password" id="pwdNew" required minlength="6" autocomplete="new-password" placeholder="至少 6 位" />
            </label>
            <label>
              <span>确认新密码</span>
              <input type="password" id="pwdNew2" required minlength="6" autocomplete="new-password" />
            </label>
            <p class="admin-dialog-error" id="pwdError" hidden></p>
            <p class="pwd-ok" id="pwdOk" hidden>密码已更新</p>
            <button type="submit" class="admin-btn primary" id="btnSavePwd">保存新密码</button>
          </form>
        </section>

        <section class="admin-card" id="panelUsers" hidden>
          <div class="admin-toolbar">
            <form id="searchForm" class="admin-search">
              <input type="search" id="userQuery" placeholder="搜索用户名 / 显示名" />
              <button type="submit" class="admin-btn">搜索</button>
            </form>
            <button type="button" class="admin-btn primary" id="btnOpenCreate">新建用户</button>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>用户名</th>
                  <th>显示名</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>最近登录</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <tr><td colspan="7" class="admin-empty">加载中…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-pager" id="userPager"></div>
        </section>
      </main>
    </div>
  </div>

  <dialog class="admin-dialog" id="userDialog">
    <form method="dialog" id="userForm" class="admin-dialog-body">
      <h2 id="dialogTitle">新建用户</h2>
      <input type="hidden" id="editUserId" />
      <label>
        <span>用户名</span>
        <input type="text" id="formUsername" required minlength="3" maxlength="64" />
      </label>
      <label>
        <span>显示名称</span>
        <input type="text" id="formDisplay" maxlength="128" />
      </label>
      <label>
        <span id="pwdLabel">密码</span>
        <input type="password" id="formPassword" minlength="6" placeholder="至少 6 位" />
      </label>
      <label>
        <span>角色</span>
        <select id="formRole">
          <option value="user">普通用户</option>
          <option value="admin">管理员</option>
        </select>
      </label>
      <label class="admin-check" id="activeRow" hidden>
        <input type="checkbox" id="formActive" checked />
        <span>启用账号</span>
      </label>
      <p class="admin-dialog-error" id="dialogError" hidden></p>
      <div class="admin-dialog-actions">
        <button type="button" class="admin-btn ghost" id="btnCancelDialog">取消</button>
        <button type="submit" class="admin-btn primary" id="btnSaveUser">保存</button>
      </div>
    </form>
  </dialog>

  <script src="js/auth.js?v=1.3.0"></script>
  <script src="js/admin.js?v=1.3.0"></script>
</body>
</html>
